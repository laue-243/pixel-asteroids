<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Asteroids — Improved</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 6px solid #333; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="700" height="500"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let ship, bullets, asteroids, score, best, state, particles, keys = {};

function init() {
  ship = {x:350, y:250, angle:0, vx:0, vy:0};
  bullets = [];
  asteroids = [];
  particles = [];
  score = 0;
  best = parseInt(localStorage.getItem('astroBest')||'0');
  state = 'start';
  for (let i=0; i<6; i++) spawnAsteroid();
}

function spawnAsteroid(x, y, size) {
  asteroids.push({
    x: x ?? Math.random()*700,
    y: y ?? Math.random()*500,
    vx: (Math.random()-0.5)*3,
    vy: (Math.random()-0.5)*3,
    size: size ?? (25 + Math.random()*25),
    rot: Math.random()*6,
    rs: (Math.random()-0.5)*0.05
  });
}

function explode(x, y, color, n=15) {
  for (let i=0; i<n; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*8,
      vy: (Math.random()-0.5)*8,
      life: 25,
      color
    });
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,700,500);
  // Stars
  ctx.fillStyle = '#fff';
  for (let i=0; i<40; i++) ctx.fillRect((i*37)%700, (i*23)%500, 1, 1);

  // Ship
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  ctx.fillStyle = '#0f0';
  ctx.beginPath();
  ctx.moveTo(18,0); ctx.lineTo(-12,10); ctx.lineTo(-6,0); ctx.lineTo(-12,-10); ctx.fill();
  if (keys['ArrowUp']) {
    ctx.fillStyle = '#fa0';
    ctx.fillRect(-16, -3, 8, 6);
  }
  ctx.restore();

  // Bullets
  ctx.fillStyle = '#fff';
  bullets.forEach(b => ctx.fillRect(b.x-2, b.y-2, 4, 4));

  // Asteroids
  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 2;
  asteroids.forEach(a => {
    ctx.beginPath();
    for (let i=0; i<8; i++) {
      const ang = a.rot + i/8*Math.PI*2;
      const r = a.size * (0.65 + Math.sin(i*2)*0.25);
      const px = a.x + Math.cos(ang)*r;
      const py = a.y + Math.sin(ang)*r;
      i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.stroke();
  });

  // Particles
  particles.forEach((p,i) => {
    p.x += p.vx; p.y += p.vy; p.life--;
    ctx.globalAlpha = p.life/25;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
    if (p.life <= 0) particles.splice(i,1);
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#0f0';
  ctx.font = '18px monospace';
  ctx.fillText('Score: '+score+'  Best: '+best, 10, 25);

  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,700,500);
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ASTEROIDS', 350, 200);
    ctx.font = '18px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Arrows to fly | SPACE to shoot', 350, 250);
    ctx.fillText('SPACE to start', 350, 300);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,700,500);
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', 350, 200);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Score: '+score, 350, 250);
    ctx.fillText('SPACE to restart', 350, 300);
  }
}

function update() {
  if (state !== 'play') return;
  if (keys['ArrowLeft']) ship.angle -= 0.08;
  if (keys['ArrowRight']) ship.angle += 0.08;
  if (keys['ArrowUp']) {
    ship.vx += Math.cos(ship.angle)*0.25;
    ship.vy += Math.sin(ship.angle)*0.25;
  }
  ship.x = (ship.x + ship.vx + 700) % 700;
  ship.y = (ship.y + ship.vy + 500) % 500;
  ship.vx *= 0.985; ship.vy *= 0.985;

  bullets.forEach((b,i) => {
    b.x += b.vx; b.y += b.vy;
    if (b.x<0||b.x>700||b.y<0||b.y>500) bullets.splice(i,1);
  });

  asteroids.forEach((a,ai) => {
    a.x = (a.x + a.vx + 700)%700;
    a.y = (a.y + a.vy + 500)%500;
    a.rot += a.rs;
    bullets.forEach((b,bi) => {
      const dx = a.x-b.x, dy = a.y-b.y;
      if (dx*dx+dy*dy < a.size*a.size) {
        explode(a.x, a.y, '#fa0');
        asteroids.splice(ai,1);
        bullets.splice(bi,1);
        score += Math.floor(a.size);
        if (score > best) { best = score; localStorage.setItem('astroBest', best); }
        if (a.size > 18) {
          spawnAsteroid(a.x, a.y, a.size*0.6);
          spawnAsteroid(a.x, a.y, a.size*0.6);
        }
      }
    });
    const dx = a.x-ship.x, dy = a.y-ship.y;
    if (dx*dx+dy*dy < (a.size+12)*(a.size+12)) {
      explode(ship.x, ship.y, '#f44', 25);
      state = 'over';
    }
  });
  if (asteroids.length === 0) {
    for (let i=0; i<7; i++) spawnAsteroid();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((state === 'start' || state === 'over') && e.code === 'Space') {
    init(); state = 'play'; return;
  }
  if (state === 'play' && e.key === ' ') {
    bullets.push({
      x: ship.x + Math.cos(ship.angle)*20,
      y: ship.y + Math.sin(ship.angle)*20,
      vx: Math.cos(ship.angle)*8 + ship.vx,
      vy: Math.sin(ship.angle)*8 + ship.vy
    });
  }
});
document.addEventListener('keyup', e => keys[e.key] = false);

init();
loop();
</script>
</body>
</html>
