<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Asteroids</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 4px solid #333; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
let ship = {x:300, y:200, angle:0, vx:0, vy:0};
let bullets = [];
let asteroids = [];
let score = 0;
let keys = {};

function spawnAsteroid() {
  asteroids.push({
    x: Math.random()*600, y: Math.random()*400,
    vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
    size: 20 + Math.random()*20, rot: Math.random()*6
  });
}
for (let i=0; i<5; i++) spawnAsteroid();

function loop() {
  if (keys['ArrowLeft']) ship.angle -= 0.1;
  if (keys['ArrowRight']) ship.angle += 0.1;
  if (keys['ArrowUp']) {
    ship.vx += Math.cos(ship.angle)*0.2;
    ship.vy += Math.sin(ship.angle)*0.2;
  }
  ship.x = (ship.x + ship.vx + 600) % 600;
  ship.y = (ship.y + ship.vy + 400) % 400;
  ship.vx *= 0.99; ship.vy *= 0.99;

  bullets.forEach((b,i) => {
    b.x += b.vx; b.y += b.vy;
    if (b.x<0||b.x>600||b.y<0||b.y>400) bullets.splice(i,1);
  });

  asteroids.forEach((a,ai) => {
    a.x = (a.x + a.vx + 600)%600;
    a.y = (a.y + a.vy + 400)%400;
    a.rot += 0.05;
    bullets.forEach((b,bi) => {
      const dx = a.x-b.x, dy=a.y-b.y;
      if (dx*dx+dy*dy < a.size*a.size) {
        asteroids.splice(ai,1);
        bullets.splice(bi,1);
        score += 10;
        if (a.size > 15) {
          asteroids.push({x:a.x,y:a.y,vx:Math.random()-0.5,vy:Math.random()-0.5,size:a.size/1.5,rot:0});
          asteroids.push({x:a.x,y:a.y,vx:Math.random()-0.5,vy:Math.random()-0.5,size:a.size/1.5,rot:0});
        }
      }
    });
    const dx = a.x-ship.x, dy=a.y-ship.y;
    if (dx*dx+dy*dy < (a.size+10)*(a.size+10)) {
      alert('Game Over! Score: '+score);
      location.reload();
    }
  });
  if (asteroids.length === 0) { alert('Wave Clear!'); for(let i=0;i<6;i++) spawnAsteroid(); }

  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,600,400);
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  ctx.fillStyle = '#0f0';
  ctx.beginPath();
  ctx.moveTo(15,0); ctx.lineTo(-10,8); ctx.lineTo(-10,-8); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff';
  bullets.forEach(b => ctx.fillRect(b.x-2,b.y-2,4,4));
  ctx.strokeStyle = '#aaa';
  asteroids.forEach(a => {
    ctx.beginPath();
    for (let i=0; i<8; i++) {
      const ang = a.rot + i/8*Math.PI*2;
      const r = a.size * (0.7 + Math.sin(i)*0.3);
      const px = a.x + Math.cos(ang)*r;
      const py = a.y + Math.sin(ang)*r;
      i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.stroke();
  });
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('Score: '+score, 10, 20);
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') {
    bullets.push({
      x: ship.x + Math.cos(ship.angle)*15,
      y: ship.y + Math.sin(ship.angle)*15,
      vx: Math.cos(ship.angle)*6 + ship.vx,
      vy: Math.sin(ship.angle)*6 + ship.vy
    });
  }
});
document.addEventListener('keyup', e => keys[e.key] = false);

loop();
</script>
</body>
</html>
